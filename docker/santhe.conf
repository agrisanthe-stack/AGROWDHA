events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server_names_hash_bucket_size 128;

    # Rate limiting zone for backend APIs
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Internal Docker upstreams
    upstream backend_server {
        server backend:5000 fail_timeout=0;
    }

    upstream openinary_server {
        server openinary:3000 fail_timeout=0;
    }

    # ============================================================
    # MAIN SITE ROUTING: farmersanthe.com
    # ============================================================

    # HTTP → HTTPS Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name localhost farmersanthe.com ://farmersanthe.com;

        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS - Main Site Engine
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost farmersanthe.com ://farmersanthe.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Core global security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 50M;

        # Local distribution: Serve built React assets directly from local storage
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # API Proxies to Express service block
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Large File Pipeline (Uploads)
        location /api/upload {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # CDN Pipeline (Openinary Media Integration)
        location /t/ {
            proxy_pass http://openinary_server/t/;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================================
    # FPO TENANT ROUTING: *.farmersanthe.com (Wildcards)
    # ============================================================

    # Wildcard HTTP → HTTPS Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name ~^(?<orgslug>[a-z0-9-]+)\.farmersanthe\.com$;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Wildcard HTTPS - Tennant Platform
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ~^(?<orgslug>[a-z0-9-]+)\.farmersanthe\.com$;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        client_max_body_size 50M;

        # Base tenant URL modification matching individual slug pages
        location = / {
            return 302 /org/$orgslug;
        }

        # Serve identical React app build local structures to subdomains
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
        

        # Context-aware Tenant API Routing (injects X-Org-Slug header)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Org-Slug $orgslug;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Tenant File Upload pipeline
        location /api/upload {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Org-Slug $orgslug;
            proxy_request_buffering off;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Tenant CDN routing
        location /t/ {
            proxy_pass http://openinary_server/t/;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
