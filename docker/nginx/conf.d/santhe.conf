# Upstream servers
upstream api_server {
    server backend:5000 fail_timeout=0;
}

upstream frontend_server {
    server frontend:80 fail_timeout=0;
}

upstream openinary_server {
    server openinary:3000 fail_timeout=0;
}

# ============================================================
# MAIN SITE: farmersanthe.com
# ============================================================

# HTTP → HTTPS redirect for main domain
server {
    listen 80;
    listen [::]:80;
    server_name farmersanthe.com www.farmersanthe.com;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farmersanthe.com www.farmersanthe.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    # API calls → Backend container
    location /api/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Upload endpoint with increased limits
    location /api/upload {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Openinary media files (/t/ is Openinary's served-file path)
    location /t/ {
        proxy_pass http://openinary_server/t/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static files & pages → Frontend container (React build)
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# FPO TENANT STORES: *.farmersanthe.com (wildcard subdomains)
# e.g. mandya-fpc.farmersanthe.com, jamkhandi-fpc.farmersanthe.com
# New FPOs get their subdomain automatically — no config change needed
# ============================================================

# HTTP → HTTPS redirect for all FPO subdomains
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<orgslug>[a-z0-9-]+)\.farmersanthe\.com$;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - FPO tenant stores
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<orgslug>[a-z0-9-]+)\.farmersanthe\.com$;

    # Wildcard SSL certificate covers *.farmersanthe.com
    # Generate with: certbot certonly --dns-cloudflare -d farmersanthe.com -d *.farmersanthe.com
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    # Root URL of subdomain → redirect to /org/<slug> page
    location = / {
        return 302 /org/$orgslug;
    }

    # API calls → Backend container (with org slug header)
    location /api/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Slug $orgslug;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /api/upload {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Slug $orgslug;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Openinary media files
    location /t/ {
        proxy_pass http://openinary_server/t/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static files & pages → Frontend container (React build)
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
