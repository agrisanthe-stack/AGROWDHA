version: '3.8'

# Production Docker Compose — farmersanthe.com
# Uses Neon Cloud for PostgreSQL. All AI services are self-hosted.

services:
  # ── Backend (Express API) ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: santhe-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000

      # Database (Neon Cloud)
      DATABASE_URL: ${DATABASE_URL}

      # JWT
      JWT_SECRET:     ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}

      # Image Storage
      OPENINARY_URL:          ${OPENINARY_URL}
      OPENINARY_API_KEY:      ${OPENINARY_API_KEY}
      CLOUDINARY_CLOUD_NAME:  ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:     ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET:  ${CLOUDINARY_API_SECRET}

      # Email
      ZEPTO_API_KEY:    ${ZEPTO_API_KEY}
      ZEPTO_FROM_EMAIL: ${ZEPTO_FROM_EMAIL}

      # Payments
      CASHFREE_APP_ID:    ${CASHFREE_APP_ID}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY}
      CASHFREE_MODE: production

      # Application URLs
      FRONTEND_URL: ${FRONTEND_URL:-https://farmersanthe.com}
      BACKEND_URL:  ${BACKEND_URL:-https://farmersanthe.com}

      # ── Self-hosted AI services ──────────────────────────────────────────
      TTS_PROVIDER:  piper
      PIPER_TTS_URL: http://piper-tts:5001
      NLLB_URL:      http://nllb:5002
      OLLAMA_URL:    http://ollama:11434
      OLLAMA_MODEL:  ${OLLAMA_MODEL:-llama3.2:3b}

    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      - piper-tts
      - nllb
      - ollama
    networks:
      - santhe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ── Frontend (React via internal Nginx) ───────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: santhe-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - santhe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx reverse proxy with SSL + multi-tenant routing ───────────────────
  nginx:
    image: nginx:alpine
    container_name: santhe-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - santhe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Piper TTS (self-hosted, offline TTS) ─────────────────────────────────
  piper-tts:
    build:
      context: ./docker/piper-tts
      dockerfile: Dockerfile
    container_name: santhe-piper-tts-prod
    restart: always
    environment:
      - MODELS_DIR=/models
    volumes:
      - piper_models:/models
    networks:
      - santhe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ── NLLB-200 Translation (self-hosted) ───────────────────────────────────
  nllb:
    build:
      context: ./docker/nllb
      dockerfile: Dockerfile
    container_name: santhe-nllb-prod
    restart: always
    environment:
      - NLLB_MODEL=facebook/nllb-200-distilled-600M
      - HF_HOME=/models
    volumes:
      - nllb_models:/models
    networks:
      - santhe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G

  # ── Ollama (Llama LLM) ────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: santhe-ollama-prod
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - santhe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Ollama model initializer ──────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: santhe-ollama-init-prod
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - santhe_network
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"]

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  uploads_data:
    driver: local
  piper_models:
    driver: local
  nllb_models:
    driver: local
  ollama_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  santhe_network:
    driver: bridge
